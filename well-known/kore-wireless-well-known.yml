notes: >-
  KORE publishes no /.well-known/ discovery surface. Every API host answers the
  whole /.well-known/ space with the API gateway's 401 JSON envelope (the gateway
  authenticates before routing, so the path is never served anonymously), and
  www.korewireless.com answers every unknown path with a 200 HTML homepage
  catch-all, which is not a well-known document. No security.txt, no
  openid-configuration, no oauth-authorization-server, no api-catalog, no
  ai-plugin.json. This is a recorded negative, not a missing probe: no WellKnown or
  SecurityTxt pointer is wired in apis.yml because no document exists. KORE's
  vulnerability-disclosure contact is published as an HTML page instead — see
  security/kore-wireless-vulnerability-disclosure.yml.

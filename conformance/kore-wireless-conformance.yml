generated: '2026-07-25'
method: searched
source: https://docs.korewireless.com/
notes: >-
  Standards posture asserted from KORE's own documentation and from the eight
  published OpenAPI documents. A false entry is a recorded negative, not an
  untested one — the CAMARA / GSMA Open Gateway / TM Forum negatives were confirmed
  by a full-text search of the complete documentation index
  (docs.korewireless.com/llms.txt, 358 entries) which returned zero matches for
  CAMARA, Open Gateway, TM Forum, TMF, NEF, SCEF, network exposure and network
  slicing. KORE is an MVNO, so it consumes carrier network capability rather than
  exposing it — the absence is structural, not an oversight.
standards:

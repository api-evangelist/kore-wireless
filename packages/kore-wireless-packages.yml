notes: >-
  KORE does not publish client libraries to npm, PyPI, Maven Central, NuGet,
  RubyGems, Packagist or crates.io. Its first-party SDKs are source-distributed
  from the korewireless GitHub organization (openapi-generator output, committed
  in full), and the kore-openapi repository ships a make-based workflow that
  generates a client for any of the eight cataloged specs in any
  openapi-generator language. A registry search for KORE client libraries returns
  only third-party work (npm kore-wireless-sdk, published by an individual, not
  KORE) which is recorded below as official:false.
registry_probes:

scopes: []
scopes_note: >-
  Intentionally empty. No named OAuth scope string is published by KORE anywhere —
  not in the specs, not in the docs, not in a scopes reference page. Filling this
  list would mean inventing scope identifiers. The real grant model is the
  scope_dimensions block above.
gaps_for_provider:
- publish the enumeration of Global Resources and Products selectable on an API Client
- declare the scopes map on each oauth2 securityScheme in the OpenAPI documents
- apply per-operation security requirements so a consumer can compute the minimum
  client scope for a given call

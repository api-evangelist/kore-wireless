summary:
  primary: oauth2 client_credentials
  types: [oauth2, apiKey, http]
  api_key_in: [header]
  oauth2_flows: [clientCredentials]
  bearer_header: 'Authorization: Bearer {access_token}'
  credential_unit: API Client (Client ID + Client Secret), created per account in the
    console
primary_flow:
  name: OAuth 2.0 Client Credentials (RFC 6749 section 4.4)
  token_endpoint: https://api.korewireless.com/api-services/v1/auth/token
  method: POST
  content_type: application/x-www-form-urlencoded
  parameters: [grant_type=client_credentials, client_id, client_secret]
  example_request: |
    curl -X POST https://api.korewireless.com/api-services/v1/auth/token \
      --header 'cache-control: no-cache' \
      --header 'content-type: application/x-www-form-urlencoded' \
      --data "grant_type=client_credentials" \
      --data "client_id=$KORE_CLIENT_ID" \
      --data "client_secret=$KORE_CLIENT_SECRET"
  response_shape: '{access_token, expires_in, token_type: Bearer, scope}'
  token_format: RS256-signed JWT (iss/aud/sub/exp/iat/jti plus KORE claims account-id,
    client-type, client_id, scopes)
  expires_in_unit: seconds
  expiry_options: [1 hour, 24 hours, 30 days, 24 months]
  refresh: no refresh token — repeat the client-credentials exchange
  spec: openapi/kore-wireless-token.yml
credentials:
  where: API Client details in the KORE console (https://build.korewireless.com/clients/list)
  client_secret_visibility: shown once at creation and never retrievable again
  client_id_visibility: always visible
  scoping: Client Type (Admin or Standard) plus selected Global Resources and Products
  locking: a client can be locked so only Account Owner, Account Admins and the Client
    Owner may edit it
  per_account: a client targets exactly one account; child accounts each need their
    own client
errors:
- {stage: token exchange, http: 401, body: '{"error":"unauthorized_client","error_description":"Invalid
    client or Invalid client credentials"}'}
- {stage: API call, http: 403, body: '{"message":"User is not authorized to access
    this resource with an explicit deny","error":"Invalid or expired token"}'}

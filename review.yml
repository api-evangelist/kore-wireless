  camara:
    posture: No CAMARA implementation and no CAMARA reference — MVNO consumes carrier
      network capability rather than exposing it
    exposesCamaraApis: false
    camaraApis: []
    pressReleaseOnly: false
    note: |
      This is not "a press release with nothing callable" — there is not even a press
      release. A grep of the complete published documentation index
      (docs.korewireless.com/llms.txt) for CAMARA, Open Gateway, opengateway, TM
      Forum, TMF, NEF, network exposure, SCEF, network slicing, SIM swap, number
      verification, quality on demand, and carrier billing returned zero matches.
      None of the eight OpenAPI specifications contains a CAMARA-shaped operation.
      The only KORE/CAMARA adjacency in public record is a KORE engineer quoted in
      third-party coverage about the security exposure that opening network APIs
      creates for telcos — commentary, not implementation.
    evidence:
    - url: https://docs.korewireless.com/llms.txt
      note: Full documentation index, 358 entries — zero CAMARA / Open Gateway / TM
        Forum / NEF matches.
    - url: https://github.com/korewireless/kore-openapi
      note: All eight published specs are proprietary IoT connectivity management —
        no CAMARA API shapes.
  openGateway:
    member: false
    note: KORE is not listed as a GSMA Open Gateway operator participant. Open Gateway
      is an MNO commitment layer; KORE is an MVNO reselling other operators' networks.
  aduna:
    reachesMarketThroughAduna: false
    note: No evidence of any Aduna (Ericsson/carrier JV) channel relationship. KORE
      goes direct to enterprise developers with its own platform APIs.
  tmForum:
    conformanceCertification: false
    apisImplemented: []
    note: No TM Forum Open API conformance certification found, and no TMF620 /
      TMF622 / TMF641 or any other TMF reference in KORE's documentation. KORE's
      account, subscription, and provisioning APIs are proprietary shapes, not TM
      Forum Open API shapes.
  threeGppExposure:
    nef: false
    scef: false
    networkSlicing: false
    edgeMec: false
    note: No Network Exposure Function, SCEF, 5G network-slicing, or edge/MEC API is
      published or referenced. KORE's network-side control is expressed as
      NetworkAccessProfiles (which mobile networks a SIM may attach to) and multi-IMSI
      steering, not as 3GPP exposure APIs.
  auth:
    primaryScheme: OAuth 2.0 client credentials
    tokenEndpoint: https://api.korewireless.com/api-services/v1/auth/token
    legacyTokenEndpoint: https://api.korewireless.com/Api/api/token
    schemesFound:
    - oauth2 clientCredentials (all eight specs' declared platform scheme; RFC 6749
      section 4.4)
    - apiKey in header x-api-key (ConnectivityPro and SMS)
    - http basic accountSid / authToken (Super SIM — inherited Twilio credential
      style)
    scopes: 'Declared scopes object is empty in every spec — no OAuth scopes are
      published. Authorization is expressed through API Client roles and permissions
      in the console, not through token scopes.'
    ciba: false
    cibaNote: CIBA (Client-Initiated Backchannel Authentication) does NOT appear
      anywhere. That is consistent with the CAMARA finding — CIBA is the CAMARA/OIDC
      network-authorization pattern and KORE implements no CAMARA APIs.
    oidc: false
    wellKnown:
    - url: https://api.korewireless.com/.well-known/openid-configuration
      status: 404
    - url: https://api.korewireless.com/.well-known/oauth-authorization-server
      status: 404
    - url: https://one.korewireless.com/.well-known/openid-configuration
      status: 404
    note: No OIDC discovery document is served. Token acquisition is a plain
      form-encoded POST with client_id and client_secret.
  webhooksAndEvents:
    webhooks: true
    signatureVerification: true
    idempotency: true
    eventStreams: true
    eventFormat: CloudEvents 1.0 (application/json)
    payloadSchema: JSON Schema draft-07, versioned per event type
    destinations: [Webhook, AWS Kinesis]
    documentedEventProducts: [Super SIM connection events and data sessions]
    asyncapi: false
    note: KORE publishes a real event architecture — signed, idempotent webhooks with
      rotatable secrets managed through the Webhook API, plus Event Streams with
      streaming rules routing CloudEvents-formatted events to webhook or AWS Kinesis
      destinations. No AsyncAPI document is published.
    docs:
    - https://docs.korewireless.com/developers/webhooks
    - https://docs.korewireless.com/developers/event-streams/events
    - https://docs.korewireless.com/developers/how-to/webhooks/validate-webhook-signatures
  sdks:
    firstPartyRegistryPackages: false
    note: |
      KORE publishes no first-party SDK packages on npm, PyPI, Maven, or NuGet under
      its own name (npm korewireless, @korewireless/*, kore-wireless and PyPI
      korewireless, kore-wireless, omnicore all return 404). The one npm package
      named kore-wireless-sdk is third-party (maintainer sauravkoli31,
      github.com/sauravkoli31/kore-wireless-sdk), NOT published by KORE.
      KORE's actual SDK strategy is generate-your-own: the kore-openapi repo ships a
      Makefile target (make generate-sdk SPEC=<id> GENERATOR=<lang>) that runs
      openapi-generator against the published specs.
    githubSourceSdks:
    - https://github.com/korewireless/OmniCore-JavaScript-SDK
    - https://github.com/korewireless/OmniCore-Python-SDK
    - https://github.com/korewireless/OmniCore-Go-SDK
    - https://github.com/korewireless/OmniCore-Ruby-SDK
    - https://github.com/korewireless/OmniCore-CSharp-SDK
    - https://github.com/korewireless/OmniCore-C-Device-SDK
    - https://github.com/korewireless/API-Clients
    - https://github.com/korewireless/Microvisor-SDK
  otherSurfaces:
    graphql: false
    grpc: false
    proto: false
    postmanWorkspace: false
    mcpServer: false
    note: No public GraphQL endpoint, no published .proto files, no public Postman
      workspace, and no MCP server found. Documentation is agent-addressable through
      GitBook's llms.txt / llms-full.txt / .md negotiation and an ?ask= query
      interface, which is the closest thing to an agent surface KORE ships.
  transports:
  - protocol: REST
    scheme: https
    baseURL: https://api.korewireless.com/connectivity
    documented: true
  - protocol: REST
    scheme: https
    baseURL: https://supersim.api.korewireless.com
    documented: true
  - protocol: REST
    scheme: https
    baseURL: https://programmable-wireless.api.korewireless.com
    documented: true
  - protocol: REST
    scheme: https
    baseURL: https://api.korewireless.com/sms
    documented: true
  - protocol: REST
    scheme: https
    baseURL: https://iam.api.korewireless.com
    documented: true
  - protocol: REST
    scheme: https
    baseURL: https://client.api.korewireless.com
    documented: true
  - protocol: REST
    scheme: https
    baseURL: https://webhook.api.korewireless.com
    documented: true
  - protocol: Webhook
    scheme: https
    documented: true
    note: Customer-hosted endpoints receiving signed, idempotent CloudEvents callbacks.
  - protocol: AWS Kinesis
    documented: true
    note: Event Streams destination type.
  - protocol: GraphQL
    documented: false
  - protocol: WebSocket
    documented: false
  - protocol: gRPC
    documented: false

aid: kore-wireless
name: KORE Wireless
review:
  question: Does KORE Wireless publish a real, self-serve public API surface, and what
    is its CAMARA / GSMA Open Gateway posture?
  answer: true
  date: '2026-07-25'
  reviewer: API Evangelist
  sector: Telecommunications
  tier: iot-esim
  homeMarket: United States
  valueChainPosition: |
    Aggregator, not carrier. KORE Group Holdings is a global mobile virtual network
    operator (MVNO) headquartered in Atlanta, Georgia. It owns no spectrum and no
    radio access network; it resells and orchestrates multi-carrier cellular
    connectivity, eSIM/iSIM provisioning, device management, and IoT security to
    enterprises in more than 190 countries, with over 20 million IoT connections
    under management. KORE acquired the Twilio IoT business in 2024 (Super SIM,
    Programmable Wireless, Microvisor) and inherited Twilio's developer-first API
    posture along with it. KORE was taken private by Searchlight Capital Partners
    and Abry Partners in 2026 and delisted from the NYSE.
findings:
  summary: |
    KORE Wireless lands squarely in the API-native half of the telecom split. This
    is a real self-serve developer surface, not a partner-gated carrier landing
    page. Documentation at docs.korewireless.com is fully open (GitBook, HTTP 200,
    no login, llms.txt and .md content negotiation for agents), account
    registration at console.korewireless.com is self-serve with email OTP
    verification, and — the strongest signal — KORE publishes eight OpenAPI 3.0
    specifications VERBATIM in a public GitHub repository at
    github.com/korewireless/kore-openapi, in both YAML and JSON, with a
    machine-readable specs/catalog.json and a make-based openapi-generator SDK
    workflow. All eight specs were fetched at HTTP 200 and all eight parse as valid
    OpenAPI 3.0.x with paths.

    The CAMARA finding is a clean negative and it is the honest one. KORE exposes
    NO CAMARA network APIs. There is no Number Verification, SIM Swap, Device
    Location, Device Status, Quality on Demand, Carrier Billing, KYC Match, Scam
    Signal, Device Swap, or Population Density surface anywhere in KORE's specs or
    documentation. A full-text grep of the complete documentation index
    (docs.korewireless.com/llms.txt, 358 entries) for "CAMARA", "Open Gateway",
    "TM Forum", "TMF", "NEF", "network exposure", "SCEF", and "network slicing"
    returned ZERO matches. KORE is not on the GSMA Open Gateway operator
    participant list, which is expected: Open Gateway is an MNO commitment layer
    and KORE is an MVNO — it consumes carrier network capability rather than
    exposing it. There is not even a press release naming CAMARA. The only public
    KORE/CAMARA adjacency found is a KORE engineer (Jorrit Kronjee) quoted in
    third-party coverage about the security risks of opening telco network APIs —
    commentary on the standard, not an implementation of it.

    So KORE's API story is entirely its own IoT connectivity platform, not the
    industry network-API standard. That is a meaningful distinction for the sector
    report: the aggregator layer out-publishes the carriers, but what it publishes
    is proprietary connectivity management, not CAMARA.

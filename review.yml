      base_url, token_url, portal, and docs_url. A Makefile drives openapi-generator
      SDK generation (make generate-sdk SPEC=supersim-v1 GENERATOR=typescript-fetch)
      and a smoke-test harness. All 8 YAML specs were harvested verbatim into

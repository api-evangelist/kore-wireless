apis:
- aid: kore-wireless:kore-connectivity-pro-api
  name: KORE Connectivity Pro API
  description: The KORE ConnectivityPro API is the largest of KORE's published
    surfaces — 49 paths and 55 operations covering SIM and eSIM provisioning,
    eSIM profile management, activation profiles, subscriptions, accounts, usage
    and session data, diagnostics, eligibility checks, testing, alerting, and
    reporting for KORE's global multi-carrier IoT connectivity platform.
  humanURL: https://developer.korewireless.com/
  baseURL: https://api.korewireless.com/connectivity
  tags:
  - Connectivity
  - eSIM
  - Provisioning
  - SIM Management
  - IoT
  properties:
  - type: OpenAPI
    url: openapi/kore-wireless-connectivity-pro.yml
  - type: Overlay
    url: overlays/kore-wireless-connectivity-pro-overlay.yaml
  - type: Documentation
    url: https://docs.korewireless.com/omnisim/kore-omnisim-r
  - type: APIReference
    url: https://github.com/korewireless/kore-openapi/blob/main/specs/connectivity-pro/yaml/kore-connectivity-pro-v1.yaml
- aid: kore-wireless:kore-super-sim-api
  name: KORE Super SIM API
  description: Super SIM is the multi-IMSI global cellular connectivity platform
    KORE acquired from Twilio IoT. The API exposes 20 paths and 31 operations across
    Sim, Fleet, NetworkAccessProfile, Network, eSimProfile, SettingsUpdate,
    BillingPeriod, UsageRecord, SmsCommand, IpCommand, and OTA resources, letting
    developers provision SIMs, control which mobile networks devices may attach to,
    and exchange machine-to-machine SMS and IP/UDP messages with devices.
  humanURL: https://docs.korewireless.com/api/products/supersim
  baseURL: https://supersim.api.korewireless.com
  tags:
  - Super SIM
  - eSIM
  - IoT
  - Connectivity
  - Roaming
  properties:
  - type: OpenAPI
    url: openapi/kore-wireless-supersim.yml
  - type: Overlay
    url: overlays/kore-wireless-supersim-overlay.yaml
  - type: Documentation
    url: https://docs.korewireless.com/supersim/supersim
  - type: APIReference
    url: https://docs.korewireless.com/api/products/supersim
- aid: kore-wireless:kore-programmable-wireless-api
  name: KORE Programmable Wireless API
  description: Programmable Wireless is the legacy Twilio IoT cellular product now
    operated by KORE. The API publishes 9 paths and 16 operations covering the
    Wireless Sim resource, RatePlan, Command, DataSession, and account- and
    SIM-level UsageRecord resources for managing single-network programmable
    cellular subscriptions.
  humanURL: https://docs.korewireless.com/api/products/programmable-wireless-r
  baseURL: https://programmable-wireless.api.korewireless.com
  tags:
  - Programmable Wireless
  - IoT
  - SIM Management
  - Connectivity
  properties:
  - type: OpenAPI
    url: openapi/kore-wireless-programmable-wireless.yml
  - type: Overlay
    url: overlays/kore-wireless-programmable-wireless-overlay.yaml
  - type: Documentation
    url: https://docs.korewireless.com/api/products/programmable-wireless-r
  - type: APIReference
    url: https://docs.korewireless.com/api/products/programmable-wireless-r/wireless-sim-resource
- aid: kore-wireless:kore-sms-api
  name: KORE SMS API
  description: The KORE SMS API programmatically exchanges short messages with IoT
    devices on KORE connectivity. Three operations — send a message, list messages,
    and retrieve SMS message history — form the messaging surface. This is
    device-directed machine-to-machine SMS, not an A2P/CPaaS messaging product.
  humanURL: https://developer.korewireless.com/
  baseURL: https://api.korewireless.com/sms
  tags:
  - SMS
  - Messaging
  - IoT
  properties:
  - type: OpenAPI
    url: openapi/kore-wireless-sms.yml
  - type: Overlay
    url: overlays/kore-wireless-sms-overlay.yaml
  - type: APIReference
    url: https://github.com/korewireless/kore-openapi/blob/main/specs/sms/yaml/kore-sms-v1.yaml
- aid: kore-wireless:kore-webhook-api
  name: KORE Webhook API
  description: The public KORE Webhook API creates, retrieves, and modifies the
    signing secrets used to verify callbacks KORE sends to customer endpoints.
    KORE webhooks are signature-verified and idempotent, and the companion Event
    Streams product delivers CloudEvents 1.0 formatted events with versioned
    JSON Schema (draft-07) payloads to webhook or AWS Kinesis destinations.
  humanURL: https://docs.korewireless.com/api/global-resources/webhook
  baseURL: https://webhook.api.korewireless.com
  tags:
  - Webhooks
  - Events
  - CloudEvents
  properties:
  - type: OpenAPI
    url: openapi/kore-wireless-webhook.yml
  - type: Overlay
    url: overlays/kore-wireless-webhook-overlay.yaml
  - type: Documentation
    url: https://docs.korewireless.com/developers/webhooks
  - type: APIReference
    url: https://docs.korewireless.com/api/global-resources/webhook
- aid: kore-wireless:kore-iam-api
  name: KORE Identity and Access Management API
  description: The KORE IAM API manages customer accounts and their relationships —
    creating accounts, retrieving account hierarchies, and managing platform-specific
    mappings between parent and child accounts across KORE's product platforms.
  humanURL: https://docs.korewireless.com/api/global-resources/iam/account
  baseURL: https://iam.api.korewireless.com
  tags:

aid: kore-wireless
url: https://raw.githubusercontent.com/api-evangelist/kore-wireless/refs/heads/main/apis.yml
name: KORE Wireless
kind: company
description: >-
  KORE Wireless (KORE Group Holdings) is an Atlanta, Georgia headquartered
  global IoT connectivity provider operating as a mobile virtual network operator
  (MVNO) across more than 190 countries, with over 20 million IoT connections under
  management. KORE sits in the aggregator half of the telecom value chain: it does
  not own spectrum or radio access network, it resells and orchestrates multi-carrier
  cellular connectivity, eSIM/iSIM provisioning, device management, and IoT security
  as a service to enterprises in healthcare, fleet, logistics, utilities, and
  industrial automation. In 2024 KORE acquired the Twilio IoT business — Super SIM,
  Programmable Wireless, and Microvisor — inheriting a genuinely developer-first API
  surface, and it has kept that posture: KORE publishes eight OpenAPI 3.0
  specifications in a public GitHub repository (github.com/korewireless/kore-openapi)
  with a make-based SDK generation workflow, an open GitBook documentation site at
  docs.korewireless.com requiring no login, self-serve account registration at
  console.korewireless.com, OAuth 2.0 client-credentials authorization, signed
  webhooks, and CloudEvents-formatted event streams. KORE publishes no CAMARA network
  APIs and is not a GSMA Open Gateway operator participant — as an MVNO it consumes
  carrier network capability rather than exposing it, and no CAMARA, Open Gateway,
  TM Forum, or NEF/SCEF reference appears anywhere in its documentation. In 2026 KORE
  was taken private by Searchlight Capital Partners and Abry Partners and delisted
  from the NYSE.

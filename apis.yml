- aid: kore-wireless:kore-api-clients-api
  name: KORE API Clients API
  description: The Client Management API creates, retrieves, and lists the API
    Clients that hold the credentials and settings for an integration with KORE.
    An API Client is the required gateway to every other KORE API — it issues the
    Client ID and Client Secret exchanged for an OAuth 2.0 access token.
  humanURL: https://docs.korewireless.com/api/global-resources/api-clients/clients
  baseURL: https://client.api.korewireless.com
  tags:
  - API Management
  - Clients
  - Credentials
  properties:
  - type: OpenAPI
    url: openapi/kore-wireless-api-clients.yml
  - type: Overlay
    url: overlays/kore-wireless-api-clients-overlay.yaml
  - type: Documentation
    url: https://docs.korewireless.com/developers/api-management/api-clients
  - type: APIReference
    url: https://docs.korewireless.com/api/global-resources/api-clients/clients
- aid: kore-wireless:kore-token-api
  name: KORE Token API
  description: The KORE Token API is the OAuth 2.0 authorization endpoint for the
    whole platform. A single POST to /v1/auth/token exchanges Client Credentials
    for a bearer access token per RFC 6749 section 4.4, with a configurable token
    expiry set on the API Client.
  humanURL: https://docs.korewireless.com/developers/api-management/auth
  baseURL: https://api.korewireless.com/api-services
  tags:
  - Authentication
  - OAuth
  - Security
  properties:

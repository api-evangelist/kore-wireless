  /v1/accounts/{account-id}/rules/{rule-id}:
    put:
      tags:
      - alerting
      summary: Update An Existing Rule
      description: modifies an existing rule upon providing the rule Id
      operationId: updateRuleByRuleId
      parameters:
      - name: account-id
        in: path
        description: The unique identifier of your account
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: rule-id
        in: path
        required: true
        style: simple
        explode: false
        schema:
          type: string
      requestBody:
        description: update a rule
        content:
          application/json:
            schema:
              required:
              - actions
              - conditions
              - enabled
              - event-name
              - rule-name
              type: object
              properties:
                rule-name:
                  type: string
                event-name:
                  type: string
                enabled:
                  type: boolean
                conditions:
                  type: array
                  description: Individual conditions are chained with AND operator by default
                  items:
                    type: object
                    properties:
                      attribute-name:
                        type: string
                      condition-operator:
                        type: string
                        description: Possible Operator values are (==, !=, <, <=, >, >=, in, not in).
                      attribute-value:
                        type: string
                    example: null
                    $$ref: '#/components/schemas/InputRule_conditions'
                actions:
                  type: object
                  properties:
                    webhook:
                      required:
                      - webhook-url
                      type: object
                      properties:
                        webhook-url:
                          type: string
                        access-token:
                          type: string
                        access-token-key:
                          type: string
                      example: null
                      $$ref: '#/components/schemas/InputRule_actions_webhook'
                    email:
                      required:
                      - to
                      type: object
                      properties:
                        to:
                          type: string
                        cc:
                          type: string
                        bcc:
                          type: string
                      example: null
                      $$ref: '#/components/schemas/InputRule_actions_email'
                    block-usage:
                      required:
                      - period
                      type: object
                      properties:
                        period:
                          type: string
                      example: null
                      $$ref: '#/components/schemas/InputRule_actions_blockusage'
                  example: null
                  $$ref: '#/components/schemas/InputRule_actions'
                alert-strategy:
                  type: object
                  properties:
                    batching:
                      type: object
                      properties:
                        type:
                          type: string
                          description: When hourly is specified, the alerts will be batched and sent every hour. When daily is specified, the alerts will be batched & sent at times specified for the value "times".
                          enum:
                          - daily
                          - hourly
                        times:
                          type: array
                          description: This is used to specify an array of times, in a 24-hour format, to send alerts with a max number of 10 times. This value is only needed only if the type value is "daily". If the type specified is hourly, this ‘time’ value is ignored.
                          items:
                            type: string
                            format: hh:mm:ss
                      example: null
                      $$ref: '#/components/schemas/Rules_alertstrategy_batching'
                  description: Optional:Define a batching strategy for the alerts you receive
                  example: null
                  $$ref: '#/components/schemas/Rules_alertstrategy'
              $$ref: '#/components/schemas/InputRule'
        required: true
      responses:

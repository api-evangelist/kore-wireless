            Access-Control-Allow-Methods:
              style: simple
              explode: false
              schema:
                type: string
            Access-Control-Allow-Credentials:
              style: simple
              explode: false
              schema:
                type: string
            Access-Control-Allow-Headers:
              style: simple
              explode: false
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  account-id:
                    type: string
                  rules:
                    type: array
                    items:
                      type: object
                      properties:
                        rule-id:
                          type: string
                        rule-name:
                          type: string
                        event-name:
                          type: string
                        enabled:
                          type: boolean
                        date-added:
                          type: string
                          format: dateTime
                        date-updated:
                          type: string
                          format: dateTime
                        conditions:
                          type: array
                          items:
                            type: object
                            properties:
                              attribute-name:
                                type: string
                              condition-operator:
                                type: string
                              attribute-value:
                                type: string
                            example: null
                            $$ref: '#/components/schemas/Rules_conditions'
                        actions:
                          type: object
                          properties:
                            webhook:
                              type: object
                              properties:
                                webhook-url:
                                  type: string
                                access-token:
                                  type: string
                                access-token-key:
                                  type: string
                              example: null
                              $$ref: '#/components/schemas/Rules_actions_webhook'
                            email:
                              type: object
                              properties:
                                to:
                                  type: string
                                cc:
                                  type: string
                                bcc:
                                  type: string
                              example: null
                              $$ref: '#/components/schemas/Rules_actions_email'
                            block-usage:
                              type: object
                              properties:
                                period:
                                  type: string
                              example: null
                              $$ref: '#/components/schemas/Rules_actions_blockusage'
                          example: null
                          $$ref: '#/components/schemas/Rules_actions'
                        alert-strategy:
                          type: object
                          properties:
                            batching:
                              type: object
                              properties:
                                type:
                                  type: string
                                  description: When hourly is specified, the alerts will be batched and sent every hour. When daily is specified, the alerts will be batched & sent at times specified for the value "times".
                                  enum:
                                  - daily
                                  - hourly
                                times:
                                  type: array
                                  description: This is used to specify an array of times, in a 24-hour format, to send alerts with a max number of 10 times. This value is only needed only if the type value is "daily". If the type specified is hourly, this ‘time’ value is ignored.
                                  items:
                                    type: string
                                    format: hh:mm:ss
                              example: null
                              $$ref: '#/components/schemas/Rules_alertstrategy_batching'
                          description: Optional:Define a batching strategy for the alerts you receive
                          example: null
                          $$ref: '#/components/schemas/Rules_alertstrategy'
                      example: null
                      $$ref: '#/components/schemas/Rules_rules'
                $$ref: '#/components/schemas/Rules'

    post:
      tags:
      - alerting
      summary: Add A New Rule
      description: adds a new rule for non usage alerting
      operationId: createRule
      parameters:
      - name: account-id
        in: path
        description: The unique identifier of your account
        required: true
        style: simple
        explode: false
        schema:
          type: string
      requestBody:
        description: create a rule
        content:
          application/json:
            schema:
              required:
              - actions
              - conditions
              - enabled
              - event-name
              - rule-name
              type: object
              properties:
                rule-name:
                  type: string
                event-name:
                  type: string
                enabled:
                  type: boolean
                conditions:
                  type: array
                  description: Individual conditions are chained with AND operator by default
                  items:
                    type: object
                    properties:
                      attribute-name:
                        type: string
                      condition-operator:
                        type: string
                        description: Possible Operator values are (==, !=, <, <=, >, >=, in, not in).
                      attribute-value:
                        type: string
                    example: null
                    $$ref: '#/components/schemas/InputRule_conditions'
                actions:
                  type: object
                  properties:
                    webhook:
                      required:
                      - webhook-url
                      type: object
                      properties:
                        webhook-url:
                          type: string
                        access-token:
                          type: string
                        access-token-key:
                          type: string
                      example: null
                      $$ref: '#/components/schemas/InputRule_actions_webhook'
                    email:
                      required:

paths:
  /v1/Sims/{Sid}/DataSessions:
    parameters:
    - name: Sid
      in: path
      description: The SID of the Sim resource to read the usage from.
      schema:
        type: string
      required: true
    get:
      summary: List Data Usage records for a sim
      tags:
      - DataSessions Resource
      operationId: getDataSession
      parameters:
      - name: PageSize
        in: query
        required: false
        schema:
          type: integer
          description: How many resources to return in each list page. The default is 50, and the maximum is 1000. Minimum= 1 Maximum=1000
      - name: Page
        in: query
        required: false
        schema:
          type: integer
        description: The page index. This value is simply for client state.
      - name: PageToken
        description: The page token. This is provided by the API.
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Data Usage List
          content:
            application/json:
              schema:
                type: object
                properties:
                  data_sessions:
                    type: array
                    items:
                      $ref: '#/components/schemas/DataSession'
                  meta:
                    properties:
                      first_page_url:
                        format: uri
                        type: string
                      key:
                        type: string
                      next_page_url:
                        format: uri
                        type:
                        - string
                        - 'null'
                      page:
                        type: integer
                      page_size:
                        type: integer
                      previous_page_url:
                        format: uri
                        type:
                        - string
                        - 'null'
                      url:
                        format: uri
                        type: string
                    type: object
                title: ListDataSessionResponse
          headers:
            Access-Control-Allow-Origin:
              schema:
                type: string
            Access-Control-Allow-Methods:
              schema:
                type: string
            Access-Control-Allow-Credentials:
              schema:
                type: string
            Access-Control-Allow-Headers:
              schema:
                type: string

openapi: 3.2.0
info:
  title: Connectivity Usage API
  description: Connectivity APIs help users manage their connectivity through APIs.
  version: 1.0.0
servers:
- url: https://api.korewireless.com/connectivity
  description: Production
security:
- {}
- Auth: []
- api_key: []
tags:
- name: usage
  description: A user can retrieve usage records for a given subscription or plan
paths:
  /v1/accounts/{account-id}/subscriptions/{subscription-id}/usage-records:
    get:
      tags:
      - usage
      summary: Finds Usage Records By Sim Number And Date Range
      description: Get usage records for a subscription
      operationId: getUsageRecordBySimNumberandDateRange
      parameters:
      - name: account-id
        in: path
        description: The unique identifier of your account
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: subscription-id
        in: path
        description: The unique identifier for the SIM
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: start-date
        in: query
        required: true
        style: form
        explode: true
        schema:
          type: string
          format: YYYY-MM-DD
      - name: end-date
        in: query
        description: Date range must fall in between 60 days
        required: true
        style: form
        explode: true
        schema:
          type: string
          format: YYYY-MM-DD
      - name: source
        in: query
        required: false
        style: form
        explode: true
        schema:
          type: string
          enum:
          - cdr
      - name: include-plan-name
        description: Indicates whether the Plan Name of which the device is in when the usages is incurred should be included in the Response.
        in: query
        required: false
        schema:
          type: boolean
      responses:
        '200':
          description: 200 response
          headers:
            Access-Control-Allow-Origin:
              style: simple
              explode: false
              schema:
                type: string
            Access-Control-Allow-Methods:
              style: simple
              explode: false
              schema:
                type: string
            Access-Control-Allow-Credentials:
              style: simple
              explode: false
              schema:
                type: string
            Access-Control-Allow-Headers:
              style: simple
              explode: false
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  source:
                    type: string
                  subscription-id:
                    type: string
                    example: cmp-k1-subscription-000000
                  data:
                    type: object
                    properties:
                      total-usage:
                        type: integer
                        example: 172769726373
                      unit:
                        type: string
                        example: byte
                      daily-usages:
                        type: array
                        items:
                          type: object
                          properties:
                            date:
                              type: string
                              description: YYYY-MM-DD:HH:MM:SS
                              format: dateTime
                              example: '2022-10-24T00:00:00'
                            total-usage:
                              type: integer
                              example: 3545683147
                            unit:
                              type: string
                              example: byte
                          $$ref: '#/components/schemas/SingleFeatureUsageRecord_dailyusages'
                    $$ref: '#/components/schemas/SingleFeatureUsageRecord'
                  sms:
                    type: object
                    properties:
                      total-usage:
                        type: integer
                        example: 172769726373
                      unit:
                        type: string
                        example: event
                      daily-usages:
                        type: array
                        items:
                          type: object
                          properties:
                            date:
                              type: string
                              description: YYYY-MM-DD:HH:MM:SS
                              format: dateTime
                              example: '2022-10-24T00:00:00'
                            total-usage:
                              type: integer
                              example: 3545683147
                            unit:
                              type: string
                              example: event
                          $$ref: '#/components/schemas/SingleFeatureUsageRecordSMS_dailyusages'
                    $$ref: '#/components/schemas/SingleFeatureUsageRecordSMS'
                  voice:
                    type: object
                    properties:
                      total-usage:
                        type: integer
                        example: 172769726373
                      unit:
                        type: string
                        example: sec
                      daily-usages:
                        type: array
                        items:
                          type: object
                          properties:
                            date:
                              type: string
                              description: YYYY-MM-DD:HH:MM:SS
                              format: dateTime
                              example: '2022-10-24T00:00:00'
                            total-usage:
                              type: integer
                              example: 3545683147
                            unit:
                              type: string
                              example: sec
                          $$ref: '#/components/schemas/SingleFeatureUsageRecordVoice_dailyusages'
                    $$ref: '#/components/schemas/SingleFeatureUsageRecordVoice'
                $$ref: '#/components/schemas/SimUsageRecord'
        '400':
          description: Bad Request
          headers:
            Access-Control-Allow-Origin:
              style: simple
              explode: false
              schema:
                type: string
            Access-Control-Allow-Methods:
              style: simple
              explode: false
              schema:
                type: string
            Access-Control-Allow-Credentials:
              style: simple
              explode: false
              schema:

  /v1/accounts/{account-id}/subscription-requests:
    post:
      tags:
      - subscription
      summary: Update Subscription Details
      description: Create a subscription request to update Subscriptions
      operationId: updateSubscriptionsBySubscriptionId
      parameters:
      - name: account-id
        in: path
        description: The unique identifier of your account
        required: true
        style: simple
        explode: false
        schema:
          type: string
      requestBody:
        description: update subscriptions
        content:
          application/json:
            schema:
              required:
              - subscription-request
              type: object
              properties:
                subscription-request:
                  required:
                  - subscriptions
                  type: object
                  properties:
                    subscriptions:
                      type: array
                      items:
                        required:
                        - subscription-id
                        type: object
                        properties:
                          subscription-id:
                            type: string
                          additional-fields:
                            type: array
                            items:
                              type: object
                              properties:

openapi: 3.2.0
info:
  title: Connectivity Subscription API
  description: Connectivity APIs help users manage their connectivity through APIs.
  version: 1.0.0
servers:
- url: https://api.korewireless.com/connectivity
  description: Production
security:
- {}
- Auth: []
- api_key: []
tags:
- name: subscription
  description: API provides subscription enquiries made by the customer.
paths:
  /v1/accounts/{account-id}/subscriptions:
    get:
      tags:
      - subscription
      summary: Lists All Subscription Details
      description: Get details on all subscriptions for an account
      operationId: getSubscriptionsByAccountId
      parameters:
      - name: account-id
        in: path
        description: The unique identifier of your account
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: page-index
        in: query
        description: page index starting with zero
        required: true
        style: form
        explode: true
        schema:
          type: integer
      - name: max-page-item
        in: query
        description: maximum 1000 records per page
        required: true
        style: form
        explode: true
        schema:
          type: integer
      - name: sort-field
        in: query
        description: the values are case-sensitive, if not specified, will be sorted based on created time.
        required: false
        style: form
        explode: true
        schema:
          type: string
          enum:
          - subscription-id
          - iccid
          - service-type-id
          - cost-center-id
      - name: sort-direction
        in: query
        description: the values are case-sensitive
        required: false
        style: form
        explode: true
        schema:
          type: string
          default: Desc
          enum:
          - Asc
          - Desc
      - name: imsi
        in: query
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: imei
        in: query
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: iccid
        in: query
        description: 'Please note to add iccids using comma separators and upto max of 100.<br /> eg: 8765367892,856326787,8456095345,.....'
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: eid
        in: query
        description: 32 - digit unique identifier for the eSIM
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: sim-state
        in: query
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: msisdn
        in: query
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: show-state-history
        in: query
        description: default - false
        required: false
        style: form
        explode: true
        schema:
          type: boolean
          default: false
          enum:
          - true
          - false
      - name: last-modified-from
        in: query
        required: false
        description: 'Date from which subscription was last modified,eg: 2023-02-23T11:20:04.077Z'
        style: form
        explode: true
        schema:
          type: string
      - name: last-modified-to
        in: query
        required: false
        style: form
        description: 'Date to which subscription was last modified,eg: 2023-02-23T11:20:04.077Z'
        explode: true
        schema:
          type: string
      responses:
        '200':
          description: 200 response
          headers:
            Access-Control-Allow-Origin:
              style: simple
              explode: false
              schema:
                type: string
            Access-Control-Allow-Methods:
              style: simple
              explode: false
              schema:
                type: string
            Access-Control-Allow-Credentials:
              style: simple
              explode: false
              schema:
                type: string
            Access-Control-Allow-Headers:
              style: simple
              explode: false
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  page-info-result:
                    type: object
                    properties:
                      total-count:
                        type: integer
                      page-index:
                        type: integer
                      max-page-item:
                        type: integer
                    example: null
                    $$ref: '#/components/schemas/Subscriptions_pageinforesult'
                  subscriptions:
                    type: array
                    items:
                      type: object
                      properties:
                        subscription-id:
                          type: string
                        iccid:
                          type: string
                          description: The ICCID of the subscription
                        eid:
                          type: string
                          description: The EID of a subscription, blank means this is not an esim
                          example: '00000000000000000000000000000000'
                        rsp-state:
                          type: string
                          description: State of the profile in eSIM
                          example: enabled
                        product-offer:
                          type: string
                          description: combination of plans, features and sim format types
                        product-offer-type:
                          type: string
                          description: Differentiates the product offer types bewteen the manufacturers
                        imei:
                          type: string
                          description: The unique identifier of the device the SIM is connected too
                        imsi:
                          type: string
                          description: The unique identifier of the subscription on the network
                        serial:
                          type: string
                          description: The serial number of the device attached to the SIM
                        model:
                          type: string
                          description: The model number of the device attached to the SIM
                        msisdns:
                          type: array
                          items:
                            type: object
                            properties:
                              msisdn:
                                type: string
                                description: The phone number attached to the subscription
                            example: null
                            $$ref: '#/components/schemas/SubscriptionDetails_msisdns'
                        last-active-profile:
                          type: array
                          description: The last known profile per state of the SIM
                          items:
                            type: object
                            properties:
                              profile-id:
                                type: integer
                              start-datetime-utc:
                                type: string
                            $$ref: '#/components/schemas/SubscriptionDetails_lastactiveprofile'
                        last-active-imsi-msisdn:
                          type: array
                          description: The last known imsi msidn per state of the SIM
                          items:
                            type: object
                            properties:
                              msisdn:
                                type: string
                              imsi:
                                type: string
                              start-datetime-utc:
                                type: string
                            $$ref: '#/components/schemas/SubscriptionDetails_lastactiveimsimsisdn'
                        last-effective-date-of-states:
                          type: array
                          description: The last known effective date per state of the SIM
                          items:
                            type: object
                            properties:
                              state:
                                type: string
                              start-date-time-utc:
                                type: string
                            example: null
                            $$ref: '#/components/schemas/SubscriptionDetails_lasteffectivedateofstates'
                        service-type-id:
                          type: string
                          description: The unique identifier of the service type
                          $$ref: '#/components/schemas/service-type-id'
                        states:
                          type: array
                          description: The state of the subscription
                          items:
                            type: object
                            properties:
                              state:
                                type: string
                                enum:
                                - Stock
                                - Active
                                - Suspend
                                - Suspend With Charge
                                - Deactivated
                                - Pending Scrap
                                - Scrapped
                                - Barred
                              state-id:
                                type: string
                              start-datetime-utc:
                                type: string
                                format: date
                              end-datetime-utc:
                                type: string
                                format: date
                              is-current:
                                type: boolean
                            example: null
                            $$ref: '#/components/schemas/SubscriptionDetails_states'
                        cost-center-id:
                          type: string
                          description: The unique identifier of your cost center
                          $$ref: '#/components/schemas/cost-center-id'
                        profiles:
                          type: array
                          items:
                            type: object
                            properties:
                              profile-id:
                                type: string
                                description: The unique identifier of the feature-plan combination
                                $$ref: '#/components/schemas/profile-id'
                              start-datetime-utc:
                                type: string
                                format: date
                              end-datetime-utc:
                                type: string
                                format: date
                              is-current:
                                type: boolean
                            example: null
                            $$ref: '#/components/schemas/SubscriptionDetails_profiles'
                        apn-data:
                          type: array
                          items:
                            type: object
                            properties:
                              ip-address:
                                type: string
                                description: The address of the subscription
                              apn-id:
                                type: string
                            example: null
                            $$ref: '#/components/schemas/SubscriptionDetails_apndata'
                        additional-fields:
                          type: array
                          description: A set of customer defined customer fields (key/value pairs)
                          items:
                            type: object
                            properties:
                              key:
                                type: string
                              value:
                                type: string
                            example: null
                            $$ref: '#/components/schemas/SubscriptionDetails_additionalfields'
                      $$ref: '#/components/schemas/SubscriptionDetails'
                $$ref: '#/components/schemas/Subscriptions'
        '400':
          description: Bad Request
          headers:
            Access-Control-Allow-Origin:
              style: simple
              explode: false
              schema:
                type: string
            Access-Control-Allow-Methods:
              style: simple
              explode: false
              schema:
                type: string
            Access-Control-Allow-Credentials:
              style: simple
              explode: false
              schema:
                type: string
            Access-Control-Allow-Headers:
              style: simple
              explode: false
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                $$ref: '#/components/schemas/xxx_Error'
        '401':
          description: Unauthorised User
          headers:
            Access-Control-Allow-Origin:
              style: simple
              explode: false
              schema:
                type: string
            Access-Control-Allow-Methods:
              style: simple
              explode: false
              schema:
                type: string
            Access-Control-Allow-Credentials:
              style: simple
              explode: false
              schema:
                type: string
            Access-Control-Allow-Headers:
              style: simple
              explode: false
              schema:
                type: string
          content:
            application/json:
              schema:
                required:
                - error
                - message
                type: object
                properties:
                  error:
                    type: integer
                    format: int32
                  message:
                    type: string
                $$ref: '#/components/schemas/Error'
        '403':
          description: Forbidden
          headers:
            Access-Control-Allow-Origin:
              style: simple
              explode: false
              schema:
                type: string
            Access-Control-Allow-Methods:
              style: simple
              explode: false
              schema:
                type: string
            Access-Control-Allow-Credentials:
              style: simple
              explode: false
              schema:
                type: string
            Access-Control-Allow-Headers:
              style: simple
              explode: false
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                $$ref: '#/components/schemas/xxx_Error'
        '404':
          description: The Specified Resource Was Not Found
          headers:
            Access-Control-Allow-Origin:
              style: simple
              explode: false
              schema:
                type: string
            Access-Control-Allow-Methods:
              style: simple
              explode: false
              schema:
                type: string
            Access-Control-Allow-Credentials:
              style: simple
              explode: false
              schema:
                type: string
            Access-Control-Allow-Headers:
              style: simple
              explode: false
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  INFO:
                    type: string
                $$ref: '#/components/schemas/NotFound_Error'
        '500':
          description: Server Error
          headers:
            Access-Control-Allow-Origin:
              style: simple
              explode: false
              schema:
                type: string
            Access-Control-Allow-Methods:
              style: simple
              explode: false
              schema:
                type: string
            Access-Control-Allow-Credentials:
              style: simple
              explode: false
              schema:
                type: string
            Access-Control-Allow-Headers:
              style: simple
              explode: false
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                $$ref: '#/components/schemas/xxx_Error'

openapi: 3.2.0
info:
  title: Connectivity Provisioning API
  description: Connectivity APIs help users manage their connectivity through APIs.
  version: 1.0.0
servers:
- url: https://api.korewireless.com/connectivity
  description: Production
security:
- {}
- Auth: []
- api_key: []
tags:
- name: provisioning
  description: Status of requests made by the customer
paths:
  /v1/accounts/{account-id}/provisioning-requests:
    get:
      tags:
      - provisioning
      summary: Lists All Requests
      description: Get all requests made for an account
      operationId: getRequestStatusByAccountId
      parameters:
      - name: account-id
        in: path
        description: The unique identifier of your account
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: page
        in: query
        description: page number
        required: false
        style: form
        explode: true
        schema:
          type: integer
      - name: take
        in: query
        description: number of records
        required: false
        style: form
        explode: true
        schema:
          type: integer
      - name: subscription-id
        in: query
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: iccid
        in: query
        description: The ICCID of the subscription
        required: false
        style: form
        explode: true
        schema:
          type: string
      responses:
        '200':
          description: 200 response
          headers:
            Access-Control-Allow-Origin:
              style: simple
              explode: false
              schema:
                type: string
            Access-Control-Allow-Methods:
              style: simple
              explode: false
              schema:
                type: string
            Access-Control-Allow-Credentials:
              style: simple
              explode: false
              schema:
                type: string
            Access-Control-Allow-Headers:
              style: simple
              explode: false
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  total-records:
                    type: integer
                  total-pages:
                    type: integer
                  page:
                    type: integer
                  records:
                    type: array
                    items:
                      type: object
                      properties:
                        provisioning-request-id:
                          type: string
                        date-completed:
                          type: string
                          format: dateTime
                        request-status:
                          type: string
                        number-of-subscriptions:
                          type: integer
                        service-type:
                          type: string
                        date-created:
                          type: string
                          format: dateTime
                        request-type:
                          type: string
                        source:
                          type: string
                        provisioned-by:
                          type: string
                        activation-profile-id:

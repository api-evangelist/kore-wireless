  /v1/esim/profile-status:
    get:
      tags:
      - eSIM Profile Management
      summary: Get eSIM profile status
      description: Get the RSP profile status for all subscriptions associated with the EID. Profile status is not returned for profiles that are not downloaded or were deleted.
      responses:
        '200':
          description: 200 response
          content:
            application/json:
              schema:
                type: object
                properties:
                  subscriptions:
                    type: array
                    items:
                      type: object
                      properties:
                        iccid:
                          type: string
                          description: The ICCID of the subscription
                        product-offer:
                          type: string
                          description: Combination of plans, features and sim format types
                        state:
                          type: string
                          description: 'The state of the subscription. Allowed: Stock|Active|Suspend|Suspend With. Charge|Deactivated|Pending Scrap|Scrapped|Barred'
                        profile-status:
                          type: string
                          description: 'Status of the eSIM profile in RSP. Allowed: ENABLED|DISABLED|CREATED'
                        subscription-id:
                          type: string
                          description: Unique identifier of the subscription
                        is-fallback:

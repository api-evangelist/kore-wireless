      description: Create a download profile request for an account. Downloads a new profile to the eSIM and activates the subscription. 
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                download:
                  type: object
                  properties:
                    activation-profile-id:
                      type: string

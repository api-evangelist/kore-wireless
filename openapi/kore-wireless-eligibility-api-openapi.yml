openapi: 3.2.0
info:
  title: Connectivity Eligibility API
  description: Connectivity APIs help users manage their connectivity through APIs.
  version: 1.0.0
servers:
- url: https://api.korewireless.com/connectivity
  description: Production
security:
- {}
- Auth: []
- api_key: []
tags:
- name: eligibility
  description: Retrieve details about the eligibility of a given account
paths:
  /v1/accounts/{account-id}/plans:
    get:
      tags:
      - eligibility
      summary: Lists All Eligible Plans
      description: Get all eligible plans for an account
      operationId: getPlanByAccountId
      parameters:
      - name: account-id
        in: path
        description: The unique identifier of your account
        required: true
        style: simple
        explode: false
        schema:
          type: string
      responses:
        '200':
          description: 200 response
          headers:
            Access-Control-Allow-Origin:
              style: simple
              explode: false
              schema:
                type: string
            Access-Control-Allow-Methods:
              style: simple
              explode: false
              schema:
                type: string
            Access-Control-Allow-Credentials:
              style: simple
              explode: false
              schema:
                type: string
            Access-Control-Allow-Headers:
              style: simple
              explode: false
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  plans:
                    type: array
                    items:
                      type: object
                      properties:
                        plan:
                          type: object
                          properties:
                            plan-name:
                              type: string
                              description: The name of the plan
                              $$ref: '#/components/schemas/plan-name'
                            plan-id:
                              type: string
                              description: The unique identifier of your plan
                              $$ref: '#/components/schemas/plan-id'
                            plan-type-id:
                              type: string
                            usage-type:
                              type: string

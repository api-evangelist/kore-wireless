components:
  schemas:
    DataUsageCounts:
      type: object
      properties:
        download:
          type: integer
          format: int64
        upload:
          type: integer
          format: int64
        total:
          type: integer
          format: int64
        units:
          type: string
        billed:
          type: number
          format: double
          x-jvm-type: BigDecimal
        billing_units:
          type: string
      required:
      - download
      - upload
      - total
      - units
      - billed
      - billing_units
    TimePeriod:
      type: object
      description: The time period for which usage is reported. Contains start and end properties that describe the period using GMT date-time values specified in ISO 8601 format.
      properties:
        start:
          type: string
          x-jvm-type: java.time.Instant
        end:
          type: string
          x-jvm-type: java.time.Instant
      required:
      - start
      - end
    CommandsUsageDetails:
      type: object
      description: An object that describes the aggregated Commands usage for all SIMs during the specified period.
      properties:
        from_sim:
          type: integer
          format: int64
        to_sim:
          type: integer
          format: int64
        total:
          type: integer
          format: int64
        billed:
          type: number
          format: double
          x-jvm-type: BigDecimal
        home:
          $ref: '#/components/schemas/CommandsUsageCounts'
        national_roaming:
          $ref: '#/components/schemas/CommandsUsageCounts'
        international_roaming:
          type: array
          items:
            $ref: '#/components/schemas/InternationalCommandsUsageCounts'
        billing_units:
          type: string
    UsageApiErrorResponse:
      type: object
      properties:
        code:
          description: Error Code
          type: integer
          format: int32
        status:
          description: HTTP Status Code
          type: integer
          format: int32
        message:
          description: Error Message
          type: string
        more_info:
          description: Internal Error Message
          type: string
      required:
      - code
      - status
      - message
    UsageList:
      type: object
      properties:
        usage_records:
          type: array
          items:
            $ref: '#/components/schemas/UsageRecord'
        meta:
          $ref: '#/components/schemas/ListMeta'
    ListMeta:
      type: object
      required:
      - list_key
      - page_size
      - direct_token
      properties:
        page_size:
          type: integer
          default: 0
          format: int32
        page:
          type: integer
          default: 0
        first_page_url:
          type: string
        previous_page_url:
          type: string
        url:
          type: string
        key:
          type: string
        next_page_url:
          type: string
    DataUsageDetails:
      type: object
      description: An object that describes the aggregated Data usage for all SIMs over the period.
      properties:
        download:
          type: integer
          format: int64
        upload:
          type: integer
          format: int64
        total:
          type: integer
          format: int64
        units:
          type: string
        billed:
          type: number
          format: double
          x-jvm-type: BigDecimal
        home:
          $ref: '#/components/schemas/DataUsageCounts'
        national_roaming:
          $ref: '#/components/schemas/DataUsageCounts'
        international_roaming:
          type: array
          items:
            $ref: '#/components/schemas/InternationalDataUsageCounts'
        billing_units:
          type: string
    SIMUsageRecord:
      type: object
      allOf:
      - $ref: '#/components/schemas/UsageRecord'
      - type: object
        properties:
          sim_sid:
            type: string
    InternationalDataUsageCounts:
      type: object
      properties:
        country_code:
          type: string
        download:
          type: integer
          format: int64
        upload:
          type: integer
          format: int64
        total:
          type: integer
          format: int64
        units:
          type: string
        billed:
          type: number
          format: double
          x-jvm-type: BigDecimal
        billing_units:
          type: string
      required:
      - country_code
      - download
      - upload
      - total
      - units
      - billed
      - billing_units
    SIMUsageList:
      type: object
      properties:
        usage_records:
          type: array
          items:
            $ref: '#/components/schemas/SIMUsageRecord'
        meta:
          $ref: '#/components/schemas/ListMeta'
    InternationalCommandsUsageCounts:
      type: object
      properties:
        country_code:
          type: string
        from_sim:
          type: integer
          format: int64
        to_sim:
          type: integer
          format: int64
        total:
          type: integer
          format: int64
        billed:
          type: number
          format: double
          x-jvm-type: BigDecimal
        billing_units:
          type: string
      required:
      - country_code
      - from_sim
      - to_sim
      - total
      - billed
      - billing_units
    UsageRecord:
      type: object
      properties:
        period:
          $ref: '#/components/schemas/TimePeriod'
        account_sid:
          description: The SID of the Account that created the AccountUsageRecord resource.Pattern:^AC[0-9a-fA-F]{32}$, Min length=34, Max length=34
          type: string
          x-jvm-type: AccountSid
        commands:
          $ref: '#/components/schemas/CommandsUsageDetails'
        data:
          $ref: '#/components/schemas/DataUsageDetails'
    Granularity:
      type: string
      enum:
      - all
      - daily
      - hourly
    CommandsUsageCounts:
      type: object
      properties:
        from_sim:
          type: integer
          format: int64
        to_sim:
          type: integer
          format: int64
        total:
          type: integer
          format: int64
        billed:
          type: number
          format: double
          x-jvm-type: BigDecimal
        billing_units:
          type: string
      required:
      - from_sim
      - to_sim
      - total
      - billed
      - billing_units

- target: $.info
  update:
    x-apievangelist-conventions:
      pagination: meta-data {count, page_size, page_number, previous_page_url, next_page_url}
      error_envelope: '{status, message, code, more_info}'
      idempotency: delivery-side only — kore-idempotency-token on webhook/event deliveries
      versioning: uri-path v1
      dates: GMT/UTC
- target: $.components.securitySchemes
